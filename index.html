<style>
:root{--bg:#f3f4f6;--card:#fff;--ink:#111827;--mut:#6b7280;--line:#e5e7eb;--acc:#ea580c;--acc2:#c2410c;--red:#dc2626;--ok:#16a34a;--hd:#1f2937}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--hd);color:#fff;display:flex;align-items:center;gap:8px;padding:10px 12px;min-height:56px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#back{background:none;border:0;color:#fff;font-size:30px;line-height:1;padding:0 8px 4px 0;cursor:pointer}
#back[hidden]{display:none}
#sync{font-size:12px;opacity:.8;white-space:nowrap}
main{max-width:760px;margin:0 auto;padding:12px 12px 80px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:0 0 12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin:0 0 10px;cursor:pointer;width:100%;text-align:left;font:inherit;color:inherit}
.item:active{background:#fff7ed}
.item .t{font-weight:600;font-size:17px}
.item .s{color:var(--mut);font-size:13px}
.item .grow{flex:1;min-width:0}
.item .chev{color:var(--mut);font-size:22px}
.thumb{width:64px;height:48px;border-radius:6px;object-fit:cover;background:#e5e7eb;flex:none;display:flex;align-items:center;justify-content:center;color:var(--mut);font-size:12px}
.btn{appearance:none;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:11px 14px;font:600 15px system-ui,sans-serif;cursor:pointer;min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:active{background:var(--acc2)}
.btn.dang{color:var(--red);border-color:#fecaca}
.btn.full{width:100%}
.btn.sm{min-height:38px;padding:7px 10px;font-size:14px}
.btn.on{background:var(--hd);color:#fff;border-color:var(--hd)}
.btn:disabled{opacity:.5}
h2{font-size:15px;text-transform:uppercase;letter-spacing:.04em;color:var(--mut);margin:18px 2px 8px}
.ttl{display:flex;align-items:center;gap:8px}
.ttl b{font-size:20px;flex:1;word-break:break-word}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.note{font-size:13px;color:var(--mut)}
.warn{background:#fff7ed;border:1px solid #fed7aa;color:#9a3412;border-radius:10px;padding:10px 12px;font-size:14px;margin:0 0 12px}
.cuts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cuts label,.mg label{font-size:12px;color:var(--mut);display:block}
input.in{width:100%;font:600 17px system-ui,sans-serif;padding:10px;border:1px solid #d1d5db;border-radius:8px;background:#fff;color:var(--ink)}
input.in:focus{outline:2px solid var(--acc);border-color:var(--acc)}
input.in.miss{background:#fff7ed;border-color:#fdba74}
.mg{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:center}
.mg .col{display:flex;flex-direction:column;gap:8px}
.mg svg{width:100%;height:auto}
.cvwrap{position:relative;border-radius:10px;overflow:hidden;background:#000;margin-bottom:10px}
canvas{display:block;width:100%;height:auto}
.tools{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.tools .btn{flex:1}
.hint{font-size:13px;color:var(--mut);margin:-4px 2px 10px}
.prev svg{width:100%;height:auto;max-height:340px;display:block;background:#fafafa;border-radius:8px}
table.dims{width:100%;border-collapse:collapse;margin-top:10px;font-size:15px}
table.dims td{padding:6px 4px;border-bottom:1px solid var(--line)}
table.dims td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20}
#modal[hidden]{display:none}
#modal .box{background:#fff;width:100%;max-width:520px;border-radius:16px 16px 0 0;padding:16px 16px 22px;max-height:92vh;overflow:auto}
#modal h3{margin:0 0 10px;font-size:18px}
#modal .fld{margin-bottom:10px}
#modal .fld label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
#modal .btns{display:flex;gap:8px;margin-top:6px}
#modal .btns .btn{flex:1}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:999px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30;max-width:90%}
#toast.show{opacity:1}
.hidefile{display:none}
.ordn{flex:none;width:22px;height:22px;border-radius:50%;background:#e5e7eb;color:#374151;font:700 12px/22px system-ui,sans-serif;text-align:center}
#dictbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:#111827;color:#fff;padding:12px 14px calc(14px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.25)}
#dictbar[hidden]{display:none}
#dictbar .lab{font-size:19px;font-weight:700;display:flex;align-items:center;gap:8px}
#dictbar .heard{min-height:22px;font-size:15px;opacity:.85;margin:4px 0 10px}
#dictbar .btns{display:flex;gap:8px}#dictbar .btns .btn{flex:1;min-height:44px}
input.in.dicting,select.in.dicting{outline:3px solid #f59e0b;outline-offset:2px}
.mic{display:inline-block;width:12px;height:12px;border-radius:50%;background:#ef4444;animation:pul 1s infinite}
@keyframes pul{50%{opacity:.25}}
.dtools{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:-2px 0 10px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #d1d5db;cursor:pointer;padding:0}
.sw.on{box-shadow:0 0 0 3px var(--hd)}
.chk{display:flex;align-items:center;gap:10px;font-weight:600;margin:0 2px 10px;cursor:pointer}
.chk input{width:22px;height:22px;accent-color:var(--acc)}
.btn{position:relative;overflow:hidden}
.fileov{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:100px}
</style>
</head>

<script>
// ===== PURE-START (geometría, DXF, ZIP) =====
const KEYS=['ul','lt','lb','dl','ur','rt','rb','dr'];
const MIRROR={lt:'lb',rt:'rb',ul:'ur',dl:'dr'};
const PAIRC={lt:'#2563eb',lb:'#2563eb',rt:'#16a34a',rb:'#16a34a',ul:'#9333ea',ur:'#9333ea',dl:'#d97706',dr:'#d97706'};
const KLAB={lt:'Izq · rayo → pared (arriba)',lb:'Izq · rayo → pared (abajo)',ul:'Izq · rayo → techo',dl:'Izq · rayo → mueble',
 rt:'Dcha · rayo → pared (arriba)',rb:'Dcha · rayo → pared (abajo)',ur:'Dcha · rayo → techo',dr:'Dcha · rayo → mueble'};
const KSHORT={ul:'↑ Techo',lt:'← Pared arriba',lb:'← Pared abajo',dl:'↓ Mueble',ur:'↑ Techo',rt:'Pared arriba →',rb:'Pared abajo →',dr:'↓ Mueble'};
function num(v){if(v===''||v==null)return null;const n=parseFloat(String(v).replace(',','.'));return isFinite(n)?n:null;}
function geom(f,c){
  const m={};for(const k of KEYS){m[k]=num(f.m&&f.m[k]);if(m[k]==null)return null;}
  // Origen = cruce del láser. Esquinas: TL, TR, BR, BL (Y hacia arriba)
  const meas=[[-m.lt,m.ul],[m.rt,m.ur],[m.rb,-m.dr],[-m.lb,-m.dl]];
  const fin=[[-m.lt+c.l,m.ul-c.t],[m.rt-c.r,m.ur-c.t],[m.rb-c.r,-m.dr+c.b],[-m.lb+c.l,-m.dl+c.b]];
  return {m,meas,fin};
}
const dist=(a,b)=>Math.hypot(b[0]-a[0],b[1]-a[1]);
const ENT={1:'sencillo',2:'doble',3:'triple',4:'cuádruple'};
// ---- Dictado: interpretar lo que se dice ----
const NUMW={cero:0,un:1,uno:1,una:1,unos:1,unas:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,
 dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,veinte:20,veintiun:21,veintiuno:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,
 veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,cien:100,ciento:100,
 doscientos:200,doscientas:200,trescientos:300,cuatrocientos:400,quinientos:500,seiscientos:600,setecientos:700,ochocientos:800,novecientos:900};
function wordsToNum(ws){let total=0,cur=0,any=false;for(const w of ws){if(!w||w==='y')continue;if(w==='mil'){cur=(cur||1)*1000;total+=cur;cur=0;any=true;continue;}
  if(/^\d+$/.test(w)){cur+=+w;any=true;continue;}if(!(w in NUMW))return null;cur+=NUMW[w];any=true;}return any?total+cur:null;}
function parseSpoken(t){
  t=pegados(String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!]/g,' ')).trim();
  if(/\b(parar|para|stop|terminar|termina|fin|salir)\b/.test(t))return{cmd:'stop'};
  if(/\b(atras|anterior|volver|repetir|repite)\b/.test(t))return{cmd:'back'};
  if(/\b(siguiente|saltar|salta|igual|misma|mismo|vale|ok)\b/.test(t))return{cmd:'next'};
  t=soloNumeros(t);if(!t)return{noise:true};
  let half=0;if(/\by medio\b/.test(t)){half=0.5;t=t.replace(/\by medio\b/,' ');}
  t=t.replace(/(\d)\s*,\s*(\d)/g,'$1.$2').replace(/\s+(coma|punto|con)\s+/g,' . ').replace(/\b(centimetros?|cm|milimetros?|mm|metros?)\b/g,' ');
  t=t.replace(/(\d)\s*\.\s*(\d)/g,'$1.$2').replace(/\s+/g,' ').trim();
  t=t.replace(/\b(\d{1,3})\.(\d{3})\b(?!\.)/g,'$1$2'); // 1.250 = mil doscientos cincuenta
  const m=t.match(/^\D*?(\d+(?:\.\d+)?)\s*$/)||t.match(/^\s*(\d+(?:\.\d+)?)\b/);
  if(m&&!/[a-z]{3,}/.test(t.replace(/\b(y)\b/g,'')))return{num:+m[1]+half};
  const parts=t.split('.').map(x=>x.trim().split(/\s+/));
  const a=wordsToNum(parts[0]);if(a==null)return null;
  let dec=0;if(parts[1]){const b=wordsToNum(parts[1]);if(b==null)return null;dec=+('0.'+String(b));}
  return{num:a+dec+half};
}
// Modo obra: metros + centímetros (+ "con X" o "y medio" = milímetros). Devuelve mm.
// "uno cincuenta y siete con cinco" = 1575 · "dos treinta y tres" = 2330 · "157" = 1570
function pegados(t){t=t.replace(/(\d)[.,](\d)/g,'$1\u00a7$2').replace(/[.,;:]/g,' ').replace(/\u00a7/g,',');return t.replace(/(inta|enta)y(?=[a-z])/g,'$1 y ').replace(/(\S)ymedio\b/g,'$1 y medio').replace(/\bymedio\b/g,'y medio');}
// Quita muletillas y todo lo que no sea parte de un número ("mmm", "eh", "a ver"...)
const KEEPW=new Set(['y','con','medio','coma','punto','mil']);
function soloNumeros(t){
  return t.split(/\s+/).filter(w=>w&&(/^\d+([.,]\d+)?$/.test(w)||w in NUMW||KEEPW.has(w)||segment(w))).join(' ');
}
function segment(w){ // separa números pegados: "unosetentaytres" -> uno setenta y tres
  const keys=Object.keys(NUMW).concat(['y']);const memo={};
  const go=i=>{if(i===w.length)return[];if(i in memo)return memo[i];memo[i]=null;
    for(const k of keys.slice().sort((a,b)=>b.length-a.length)){if(w.startsWith(k,i)){const r=go(i+k.length);if(r){memo[i]=[k].concat(r);break;}}}
    return memo[i];};
  return w.length>3?go(0):null;
}
function groupNums(ws){
  ws=ws.flatMap(w=>(w&&!/^\d+$/.test(w)&&w!=='y'&&!(w in NUMW)&&segment(w))||[w]);
  const out=[];let cur=null,last=null,y=false;
  for(const w of ws){
    if(!w)continue;if(w==='y'){y=true;continue;}
    if(/^\d+$/.test(w)){const v=+w;
      if(cur!=null&&last==='t'&&y&&v<10){cur+=v;last='u';y=false;continue;}
      if(cur!=null)out.push(cur);cur=v;last=(v>=20&&v<100&&v%10===0)?'t':'d';y=false;continue;}
    const v=NUMW[w];if(v==null)return null;
    const cls=v>=100?'h':(v>=20&&v%10===0)?'t':'u';
    const join=cur!=null&&((last==='h'&&v<100)||(last==='t'&&y&&v<10));
    if(join){cur+=v;}else{if(cur!=null)out.push(cur);cur=v;}
    last=join&&last==='h'&&cls!=='u'?'t':cls;y=false;
  }
  if(cur!=null)out.push(cur);
  return out.length?out:null;
}
function parseObra(t){
  t=pegados(String(t||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[¿?¡!]/g,' '))
    .replace(/\b(centimetros?|cm|milimetros?|mm|metros?|m)\b/g,' ').replace(/\s+/g,' ').trim();
  t=soloNumeros(t);if(!t)return{noise:true};
  let extra=0;
  if(/\by medio\b/.test(t)){extra+=5;t=t.replace(/\by medio\b/,' ').trim();}
  const parts=t.split(/\bcon\b/);let main=parts[0].trim();
  if(parts[1]!=null){const g=groupNums(parts[1].trim().split(/\s+/));if(!g||g.length!==1||g[0]>9)return null;extra+=g[0];}
  main=main.replace(/(\d)\s*[,.]\s*(\d)/g,'$1.$2');
  const d=main.match(/^(\d+)\.(\d+)$/);
  if(d){const a=+d[1],b=d[2];let mm;
    if(a<=9&&b.length===2)mm=a*1000+(+b)*10;        // 1,57  -> 1570
    else if(a<=9&&b.length===3)mm=a*1000+(+b);      // 1,575 -> 1575
    else mm=parseFloat(d[1]+'.'+b)*10;              // 157,5 cm -> 1575
    return{mm:mm+extra};}
  const g=groupNums(main.split(/\s+/));if(!g)return null;
  let mm;
  if(g.length===1)mm=g[0]*10;                                   // centímetros
  else if(g.length===2&&g[0]<=9&&g[1]<100)mm=g[0]*1000+g[1]*10;  // metros + cm  ("dos treinta y tres" = 2330)
  else if(g.length===2&&g[0]>=10&&g[1]<10)mm=g[0]*10+g[1];         // cm + mm      ("diecisiete seis" = 176)
  else if(g.length===3&&g[0]<=9&&g[1]<100&&g[2]<10)mm=g[0]*1000+g[1]*10+g[2];
  else return null;
  return{mm:mm+extra};
}
function cfgOf(p,f){
  if(f&&f.cfg)return{cuts:f.cfg.cuts,dia:num(f.cfg.dia)||68,sep:num(f.cfg.sep)||70};
  return{cuts:p.cuts,dia:num(p.dia)||68,sep:num(p.sep)||70};
}
function encGeom(e,p){
  const h=num(e.h),v=num(e.v);if(h==null||v==null)return null;
  const n=+e.n||1,sep=num(p.sep)||70;
  const cx=e.lado==='izq'?-h:h,cy=e.vpos==='abajo'?-v:v,pts=[];
  for(let i=0;i<n;i++){const o=(i-(n-1)/2)*sep;pts.push(e.ori==='v'?[cx,cy+o]:[cx+o,cy]);}
  return{c:[cx,cy],pts};
}
// Copete lateral (remate izq/dcha): pieza aparte de alto × largo.
// Largo = medida de la pared en obra − descuento (12 de grosor del frente + 2 de holgura del cemento cola = 14). El frente no cambia.
function copLen(cp){const pw=num(cp.largo),d=num(cp.desc),dd=d==null?14:Math.abs(d);return pw>0?pw-dd:null;}
function copGeom(cp,g){
  const m=g.m,A=num(cp.alt)||45,Lc=copLen(cp),L=Lc>0?Lc:600;
  const x0=cp.lado==='dcha'?m.rb-L:-m.lb,yTop=Math.min(-m.dl,-m.dr)-300;
  return{L,A,falta:!(Lc>0),pts:[[x0,yTop],[x0+L,yTop],[x0+L,yTop-A],[x0,yTop-A]]};
}
function copDesc(cp){const d=num(cp.desc),dd=d==null?14:Math.abs(d),pw=num(cp.largo),L=copLen(cp);
  return (cp.lado==='izq'?'izquierda':cp.lado==='dcha'?'derecha':'sin lado')+' · '+(pw>0?'pared '+fmt(pw)+' − '+fmt(dd)+' = '+fmt(L):'¿medida de pared?')+' × '+fmt(num(cp.alt)||45);}
// Enchufe doble/triple/cuádruple: una sola figura (colisa) = semicírculos en los extremos unidos en recto. Polilínea cerrada con arcos (bulge).
function encSlot(g,R){
  const b=bbox(g.pts);
  if(b.h<1e-6){const y=g.c[1];return[[b.minX,y+R,0],[b.maxX,y+R,-1],[b.maxX,y-R,0],[b.minX,y-R,-1]];}
  const x=g.c[0];return[[x-R,b.minY,0],[x-R,b.maxY,-1],[x+R,b.maxY,0],[x+R,b.minY,-1]];
}
function edgeDist(fin,c){
  const[TL,TR,BR,BL]=fin;
  const xl=BL[0]+(c[1]-BL[1])*(TL[0]-BL[0])/((TL[1]-BL[1])||1);
  const yb=BL[1]+(c[0]-BL[0])*(BR[1]-BL[1])/((BR[0]-BL[0])||1);
  return{izq:c[0]-xl,abajo:c[1]-yb};
}
function inPoly(pt,poly){let ins=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];if((yi>pt[1])!==(yj>pt[1])&&pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)ins=!ins;}return ins;}
function encDesc(e){return 'Enchufe '+(ENT[e.n]||'sencillo')+(+e.n>1?(e.ori==='v'?' vertical':' horizontal'):'')+': '+(e.lado==='izq'?'izq':'dcha')+' '+fmt(num(e.h)||0)+', '+(e.vpos==='abajo'?'abajo':'arriba')+' '+fmt(num(e.v)||0);}
function dims(p){const[TL,TR,BR,BL]=p;return{top:dist(TL,TR),bottom:dist(BL,BR),left:dist(TL,BL),right:dist(TR,BR),d1:dist(TL,BR),d2:dist(BL,TR)};}
function bbox(pts){let a=Infinity,b=Infinity,c=-Infinity,d=-Infinity;for(const p of pts){a=Math.min(a,p[0]);b=Math.min(b,p[1]);c=Math.max(c,p[0]);d=Math.max(d,p[1]);}return{minX:a,minY:b,maxX:c,maxY:d,w:c-a,h:d-b};}
function fmt(n){return String(Math.round(n*10)/10).replace('.',',');}
function safe(s){return (String(s||'').replace(/[\\/:*?"<>|]+/g,'-').replace(/\s+/g,' ').trim())||'sin-titulo';}
function dxfEsc(s){return String(s).replace(/[^\x20-\x7e]/g,ch=>'\\U+'+ch.charCodeAt(0).toString(16).toUpperCase().padStart(4,'0'));}
function D(v){return String(Math.round(v*1000)/1000);}

    // Cota alineada: p1,p2 = puntos medidos; d1,d2 = extremos de la línea de cota; tp = centro del texto
    dim(ly,style,p1,p2,d1,d2,tp,h,tsz){

      let ang=Math.atan2(uy,ux)*180/Math.PI;if(ang>90)ang-=180;if(ang<=-90)ang+=180;
      const ext=(p,d)=>{const vx=d[0]-p[0],vy=d[1]-p[1],l=Math.hypot(vx,vy);if(l<20)return;const wx=vx/l,wy=vy/l;g.line(be,br,'0',[p[0]+wx*10,p[1]+wy*10],[d[0]+wx*20,d[1]+wy*20],1);};
      ext(p1,d1);ext(p2,d2);
      g.line(be,br,'0',d1,d2,1);
      const nx=-uy,ny=ux,tx=(ux+nx)/Math.SQRT2*tsz,ty=(uy+ny)/Math.SQRT2*tsz;
      g.line(be,br,'0',[d1[0]-tx,d1[1]-ty],[d1[0]+tx,d1[1]+ty],1);g.line(be,br,'0',[d2[0]-tx,d2[1]-ty],[d2[0]+tx,d2[1]+ty],1);
      g.text(be,br,'0',tp,h,fmt(len),ang,1,2,1);

        '100','AcDbAlignedDimension','13',D(p1[0]),'23',D(p1[1]),'33','0','14',D(p2[0]),'24',D(p2[1]),'34','0']);
    },

      const rec=(type,sub,h5,body)=>th=>['0',type,h5,nh(),'330',th,'100','AcDbSymbolTableRecord','100',sub,...body];
      const lt=n=>rec('LTYPE','AcDbLinetypeTableRecord','5',['2',n,'70','0','3','','72','65','73','0','40','0.0']);
      const stH=[];

      tbl('STYLE',[th=>{const h=nh();stH.push(h);return['0','STYLE','5',h,'330',th,'100','AcDbSymbolTableRecord','100','AcDbTextStyleTableRecord','2','Standard','70','0','40','0.0','41','1.0','50','0.0','71','0','42','2.5','3','txt','4',''];}]);
      tbl('VIEW',[]);tbl('UCS',[]);

      const dsH=[];

        '40','1.0','41',D(tsz),'42','10','43','0','44','20','140',D(h),'141','0','142',D(tsz),'147','6','73','0','74','0','77','1','78','8','271','1','278','44','176','256','177','256','178','256','340',stH[0]];});
      // DIMSTYLE: hay que conocer los handles antes de la cabecera de la tabla
      {const th=nh();const body=[];dsEntries.forEach(e=>body.push(...e(th)));T.push('0','TABLE','2','DIMSTYLE','5',th,'330','0','100','AcDbSymbolTable','70',String(dimstyles.length),'100','AcDbDimStyleTable','71',String(dsH.length),...dsH.flatMap(h=>['340',h]),...body,'0','ENDTAB');}
      const brs=[[brMS,'*Model_Space'],[brPS,'*Paper_Space'],...blocks.map(b=>[b.br,b.name])];
      {const th=nh();T.push('0','TABLE','2','BLOCK_RECORD','5',th,'330','0','100','AcDbSymbolTable','70',String(brs.length));
       brs.forEach(([h,n])=>T.push('0','BLOCK_RECORD','5',h,'330',th,'100','AcDbSymbolTableRecord','100','AcDbBlockTableRecord','2',n));T.push('0','ENDTAB');}
      const B=[];
      const blk=(br,name,flags,ps,body)=>{B.push('0','BLOCK','5',nh(),'330',br,'100','AcDbEntity',...(ps?['67','1']:[]),'8','0','100','AcDbBlockBegin','2',name,'70',String(flags),'10','0','20','0','30','0','3',name,'1','',...body,
        '0','ENDBLK','5',nh(),'330',br,'100','AcDbEntity',...(ps?['67','1']:[]),'8','0','100','AcDbBlockEnd');};
      blk(brMS,'*Model_Space',0,false,[]);blk(brPS,'*Paper_Space',0,true,[]);

        '0','SECTION','2','ENTITIES',...ents,'0','ENDSEC','0','SECTION','2','OBJECTS',...O,'0','ENDSEC','0','EOF'];

const LY={ext:'EXTERIOR',obra:'0 OBRACOTAS',gen:'EX_COTAS',enc:'1_INTERIOR',txt:'EX_COTAS',med:'0 OBRA'};
function buildDXF(promo,pisos){
  const W=DXFWriter(),c=promo.cuts,H=35,HO=25;
  // Cota sobre la propia línea a-b (cotas de obra y de enchufes)
  const dimLine=(ly,a,b,h)=>{
    const len=dist(a,b);if(len<1)return;
    const ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len;
    let ang=Math.atan2(uy,ux)*180/Math.PI;if(ang>90)ang-=180;if(ang<=-90)ang+=180;
    const r=ang*Math.PI/180,upx=-Math.sin(r),upy=Math.cos(r);
    const tp=[(a[0]+b[0])/2+upx*(8+h/2),(a[1]+b[1])/2+upy*(8+h/2)];
    W.dim(ly,h===H?'FRENTE_EX':'FRENTE_OBRA',a,b,a,b,tp,h,10);
  };
  // Cota exterior paralela al lado a-b (cotas generales de la pieza)
  const cota=(ly,a,b,cen)=>{
    const len=dist(a,b);if(len<1)return;
    const ux=(b[0]-a[0])/len,uy=(b[1]-a[1])/len;let nx=-uy,ny=ux;const mx=(a[0]+b[0])/2,my=(a[1]+b[1])/2;
    if((mx-cen[0])*nx+(my-cen[1])*ny<0){nx=-nx;ny=-ny;}
    const off=90,a2=[a[0]+nx*off,a[1]+ny*off],b2=[b[0]+nx*off,b[1]+ny*off];
    const tp=[(a2[0]+b2[0])/2+nx*(12+H/2),(a2[1]+b2[1])/2+ny*(12+H/2)];
    W.dim(ly,'FRENTE_EX',a,b,a2,b2,tp,H,12);
  };
  let cy=0;
  for(const piso of pisos){
    const rowTop=cy-200;let x=0,rowH=0,any=false;
    W.text(LY.txt,[0,cy],70,String(piso.title||'').toUpperCase(),0,0,0);
    piso.frentes.forEach(f=>{
      const cf=cfgOf(promo,f),g=geom(f,cf.cuts);if(!g)return;any=true;
      const encs=(f.enchufes||[]).map(e=>({e,g:encGeom(e,cf)})).filter(q=>q.g);
      const R=cf.dia/2;
      const cops=(f.copetes||[]).map((cp,j)=>{const q=copGeom(cp,g),off=-(q.A+250)*j;return{...q,pts:q.pts.map(t=>[t[0],t[1]+off])};});
      const bb=bbox([...g.meas,...g.fin,[0,0],...encs.flatMap(q=>q.g.pts.flatMap(t=>[[t[0]-R,t[1]-R],[t[0]+R,t[1]+R]])),...cops.flatMap(q=>q.pts.map(t=>[t[0],t[1]-200]))]);
      const dx=x-bb.minX+200,dy=rowTop-bb.maxY-200;
      const S=p=>[p[0]+dx,p[1]+dy];
      const meas=g.meas.map(S),fin=g.fin.map(S),o=S([0,0]),m=g.m;
      W.lwpoly(LY.med,meas);
      W.line(LY.obra,[bb.minX+dx-40,o[1]],[bb.maxX+dx+40,o[1]],'DASHED');W.line(LY.obra,[o[0],bb.minY+dy-40],[o[0],bb.maxY+dy+40],'DASHED');
      W.lwpoly(LY.ext,fin);
      // Cotas de obra: desde las líneas del láser
      dimLine(LY.obra,S([0,m.ul-60]),S([-m.lt,m.ul-60]),HO);
      dimLine(LY.obra,S([0,-m.dl+60]),S([-m.lb,-m.dl+60]),HO);
      dimLine(LY.obra,S([0,m.ur-60]),S([m.rt,m.ur-60]),HO);
      dimLine(LY.obra,S([0,-m.dr+60]),S([m.rb,-m.dr+60]),HO);
      dimLine(LY.obra,S([-m.lt+60,0]),S([-m.lt+60,m.ul]),HO);
      dimLine(LY.obra,S([-m.lb+60,0]),S([-m.lb+60,-m.dl]),HO);
      dimLine(LY.obra,S([m.rt-60,0]),S([m.rt-60,m.ur]),HO);
      dimLine(LY.obra,S([m.rb-60,0]),S([m.rb-60,-m.dr]),HO);
      // Cotas generales de la pieza
      const cen=[(fin[0][0]+fin[2][0])/2,(fin[0][1]+fin[2][1])/2];
      cota(LY.gen,fin[0],fin[1],cen);cota(LY.gen,fin[3],fin[2],cen);
      cota(LY.gen,fin[0],fin[3],cen);cota(LY.gen,fin[1],fin[2],cen);
      // Enchufes
      encs.forEach(q=>{
        if(q.g.pts.length>1)W.lwpoly(LY.enc,encSlot(q.g,R).map(t=>[...S(t),t[2]]));else W.circle(LY.enc,S(q.g.pts[0]),R);
        const ec=q.g.c,gb=bbox(q.g.pts);
        dimLine(LY.obra,S([0,ec[1]]),S(ec),HO);
        dimLine(LY.obra,S([ec[0],0]),S(ec),HO);
        const[TL,TR,BR,BL]=g.fin;
        const xl=BL[0]+(ec[1]-BL[1])*(TL[0]-BL[0])/((TL[1]-BL[1])||1);
        const yb=BL[1]+(ec[0]-BL[0])*(BR[1]-BL[1])/((BR[0]-BL[0])||1);
        const yh=gb.minY-R-30,xv=gb.maxX+R+30;
        dimLine(LY.gen,S([xl,yh]),S([ec[0],yh]),HO);
        dimLine(LY.gen,S([xv,yb]),S([xv,ec[1]]),HO);
      });
      // Copetes (piezas aparte, debajo del frente)
      cops.forEach((q,j)=>{
        const pts=q.pts.map(S);
        W.lwpoly(LY.ext,pts);
        const cc=[(pts[0][0]+pts[2][0])/2,(pts[0][1]+pts[2][1])/2];
        cota(LY.gen,pts[3],pts[2],cc);cota(LY.gen,pts[0],pts[3],cc);
        W.text(LY.txt,[pts[0][0]+20,pts[0][1]+20],30,'COPETE'+(cops.length>1?' '+(j+1):''),0,0,0);
      });
      x+=bb.w+400+700;
      rowH=Math.max(rowH,bb.h+400);
    });
    cy=rowTop-(any?rowH:0)-400;
  }
  return W.out([['0',7],[LY.ext,7],[LY.obra,2],[LY.gen,1],[LY.enc,161],[LY.med,4]],[['Standard',2.5,0],['FRENTE_OBRA',HO,10],['FRENTE_EX',H,12]]);
}

const CRCT=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRCT[(c^u[i])&255]^(c>>>8);return(c^0xFFFFFFFF)>>>0;}
function makeZip(files){
  const enc=new TextEncoder(),parts=[],cen=[];let off=0;
  for(const f of files){
    const nm=enc.encode(f.name),d=f.data,crc=crc32(d),n=d.length;
    const lh=new DataView(new ArrayBuffer(30));

    lh.setUint16(26,nm.length,true);lh.setUint16(28,0,true);
    parts.push(new Uint8Array(lh.buffer),nm,d);
    const ch=new DataView(new ArrayBuffer(46));
    ch.setUint32(0,0x02014b50,true);ch.setUint16(4,20,true);ch.setUint16(6,20,true);ch.setUint16(8,0x0800,true);ch.setUint16(10,0,true);

    ch.setUint16(28,nm.length,true);ch.setUint16(30,0,true);ch.setUint16(32,0,true);ch.setUint16(34,0,true);ch.setUint16(36,0,true);
    ch.setUint32(38,0,true);ch.setUint32(42,off,true);
    cen.push(new Uint8Array(ch.buffer),nm);off+=30+nm.length+n;
  }
  const cs=cen.reduce((a,b)=>a+b.length,0),end=new DataView(new ArrayBuffer(22));
  end.setUint32(0,0x06054b50,true);end.setUint16(8,files.length,true);end.setUint16(10,files.length,true);
  end.setUint32(12,cs,true);end.setUint32(16,off,true);

async function gsApi(action,data){
  const g=Store.gs;if(!g)throw new Error('sin configurar');
  const r=await fetch(g.url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:g.token,action,...(data||{})})});
  let j;try{j=await r.json();}catch(e){throw new Error('respuesta');}
  if(!j.ok&&j.error==='bloqueado')throw new Error('bloqueado');
  if(!j.ok&&j.error==='clave'){if(Store.mode==='gs'){toast('La clave ya no es válida. Se ha cerrado la sesión.');await Store.wipe();}throw new Error('clave');}
  if(!j.ok)throw new Error(j.error||'error');
  return j;
}
async function gsLogin(url,key){

    const g=geom(f,cfgOf(p,f).cuts),d=g?dims(g.fin):null,r1=v=>d?Math.round(v*10)/10:'';
    const en=(f.enchufes||[]).map(e=>ENT[e.n]||'sencillo');
    rows.push([p.title||'',pi.title||'',f.name||('Frente '+(i+1)),m('lt'),m('lb'),m('ul'),m('dl'),m('rt'),m('rb'),m('ur'),m('dr'),
      d?r1(d.top):'',d?r1(d.bottom):'',d?r1(d.left):'',d?r1(d.right):'',en.length?en.length+' ('+en.join(', ')+')':'',new Date(p.updated||Date.now()).toLocaleString('es-ES')]);

async function compress(file){
  const url=URL.createObjectURL(file);
  const im=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url;});
  const max=1800,sc=Math.min(1,max/Math.max(im.naturalWidth,im.naturalHeight));
  const cv=document.createElement('canvas');cv.width=Math.round(im.naturalWidth*sc);cv.height=Math.round(im.naturalHeight*sc);
  cv.getContext('2d').drawImage(im,0,0,cv.width,cv.height);URL.revokeObjectURL(url);
  return await new Promise(res=>cv.toBlob(res,'image/jpeg',0.82));
}

function modal({title,text,fields=[],buttons}){

    const box=$('#mbox');
    box.innerHTML=`<h3>${esc(title||'')}</h3>${text?`<p class="note" style="font-size:15px">${esc(text)}</p>`:''}`+
      fields.map((f,i)=>`<div class="fld"><label>${esc(f.label||'')}</label>${f.sel?`<select class="in" data-i="${i}">${f.sel.map(([v,l])=>`<option value="${esc(v)}" ${String(v)===String(f.value)?'selected':''}>${esc(l)}</option>`).join('')}</select>`:`<input class="in" data-i="${i}" type="${f.type||'text'}" ${f.num?'inputmode="decimal"':''} value="${esc(f.value==null?'':f.value)}" placeholder="${esc(f.ph||'')}">`}</div>`).join('')+
      `<div class="btns">${buttons.map((b,i)=>`<button class="btn ${b.pri?'pri':''} ${b.dang?'dang':''}" data-b="${i}">${esc(b.label)}</button>`).join('')}</div>`;
    $('#modal').hidden=false;
    const ins=[...box.querySelectorAll('input,select')];
    const fi=box.querySelector('input');if(fi&&!fields.some(f=>f.sel))setTimeout(()=>{fi.focus();try{fi.select();}catch(e){}},50);
    const done=v=>{$('#modal').hidden=true;box.innerHTML='';res({v,values:ins.map(i=>i.value)});};
    box.querySelectorAll('[data-b]').forEach(b=>b.onclick=()=>done(buttons[+b.dataset.b].v));

function fFecha(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s||'');return m?m[3]+'/'+m[2]+'/'+m[1]:'';}
async function pisoForm(pi){
  const pr=modal({title:pi?'Editar piso':'Añadir piso',fields:[{label:'Nombre del piso',value:pi?pi.title:'',ph:'p. ej. 1º A'},{label:'Fecha de medición',type:'date',value:(pi&&pi.fecha)||hoy()}],
    buttons:[{label:'Cancelar',v:null},{label:pi?'Guardar':'Añadir',v:'ok',pri:true}]});
  const fl=[...$('#mbox').querySelectorAll('.fld')];if(fl.length===2){const w=document.createElement('div');w.className='grid2';fl[0].before(w);w.append(fl[0],fl[1]);}
  const r=await pr;if(!r.v)return null;const t=r.values[0].trim();if(!t){toast('Pon el nombre del piso');return null;}
  return{title:t,fecha:r.values[1]||hoy()};
}
async function askText(title,label,value,ph){const r=await modal({title,fields:[{label,value,ph}]});return r.v?r.values[0].trim():null;}
async function confirmDel(what){const r=await modal({title:'¿Borrar '+what+'?',text:'No se puede deshacer.',buttons:[{label:'Cancelar',v:null},{label:'Borrar',v:'ok',dang:true}]});return !!r.v;}

// ---------- Helpers de datos ----------
const P=()=>S.promos.find(p=>p.id===route.p);
const PI=()=>{const p=P();return p&&p.pisos.find(x=>x.id===route.pi);};
const F=()=>{const pi=PI();return pi&&pi.frentes.find(x=>x.id===route.f);};
function filled(f){return KEYS.filter(k=>num(f.m[k])!=null).length;}
function go(r){dictStop();if(typeof LZ!=='undefined')LZ.k=null;route=r;mode='med';render();window.scrollTo(0,0);}

function fileBtn(label,cls,kind){
  const acc=kind==='imp'?'.json,application/json':'image/*',cap=kind.startsWith('cam')?' capture="environment"':'';
  return `<label class="btn ${cls}">${label}<input type="file" class="fileov" accept="${acc}"${cap} data-file="${kind}"></label>`;
}
// ---------- Render ----------
function render(){
  const app=$('#app'),back=$('#back');
  if(Store.locked)return renderLock(app);
  if(route.v!=='home'&&!P())route={v:'home'};
  if(route.v==='piso'&&!PI())route={v:'promo',p:route.p};
  if(route.v==='frente'&&!F())route=PI()?{v:'piso',p:route.p,pi:route.pi}:{v:'home'};
  back.hidden=route.v==='home';
  if(route.v==='home')return renderHome(app);
  if(route.v==='promo')return renderPromo(app);
  if(route.v==='piso')return renderPiso(app);
  if(route.v==='frente')return renderFrente(app);
}
$('#back').onclick=()=>{
  if(route.v==='frente')go({v:'piso',p:route.p,pi:route.pi});
  else if(route.v==='piso')go({v:'promo',p:route.p});
  else go({v:'home'});
};

function renderHome(app){
  $('#ttl').textContent='Frentes de cocina';
  const warn=(inClaude&&Store.mode!=='cloud'&&Store.readyP)?'<div class="warn">Los datos se guardan solo en este navegador. Haz copia de seguridad de vez en cuando.</div>':'';
  app.innerHTML=warn+`<h2>Promociones</h2>`+
    (S.promos.length?S.promos.slice().sort((a,b)=>(b.updated||0)-(a.updated||0)).map(p=>{
      const nf=p.pisos.reduce((a,x)=>a+x.frentes.length,0);
      return `<button class="item" data-act="openPromo" data-id="${p.id}"><div class="grow"><div class="t">${esc(p.title)}</div><div class="s">${p.pisos.length} piso${p.pisos.length==1?'':'s'} · ${nf} frente${nf==1?'':'s'}</div></div><span class="chev">›</span></button>`;}).join('')
    :`<div class="empty">Aún no hay promociones.<br>Crea la primera para empezar.</div>`)+
    `<button class="btn pri full" data-act="newPromo">+ Nueva promoción</button>
     ${Store.mode==='gs'?`<h2>Sincronización</h2><div class="card"><div class="note" id="syncinfo">${esc(syncInfo())}</div>
       <div class="grid2" style="margin-top:10px"><button class="btn sm" data-act="syncNow">Sincronizar ahora</button><button class="btn sm dang" data-act="logout">Cerrar sesión</button></div></div>`:''}
     <h2>Copia de seguridad</h2>
     <label class="chk"><input type="checkbox" id="incFotos" ${incFotos?'checked':''}> Incluir fotos</label>
     <p class="note" style="margin:-4px 2px 10px">Sin fotos la copia pesa muy poco. Al importar sin fotos se conservan las fotos que ya tengas en este dispositivo.</p>
     ${mailChk()}
     <div class="grid2"><button class="btn" data-act="exportAll">Exportar copia</button><button class="btn" data-act="importAll">Importar copia</button></div>
     <p class="note" style="margin-top:14px">Cómo medir: láser en cruz sobre la encimera. Desde la línea vertical se mide a la pared izquierda y derecha, arriba y abajo. Desde la línea horizontal, en el lado izquierdo y en el derecho, se mide hasta el techo (o mueble alto) y hasta el mueble de abajo. Todas las medidas en mm.</p>`;
}

  const cs=$('#cfgSame');if(cs)cs.onchange=()=>{
    if(cs.checked)delete f.cfg;
    else{const c0=cfgOf(p,null);f.cfg={cuts:{...c0.cuts},dia:c0.dia,sep:c0.sep};}
    Store.save(p);render();
  };
  app.querySelectorAll('[data-fcut]').forEach(i=>i.oninput=()=>{const v=num(i.value);if(v!=null&&f.cfg){f.cfg.cuts[i.dataset.fcut]=v;Store.save(p);renderPrev();}});

function renderPrev(){
  const el=$('#prev');if(!el)return;const p=P(),f=F(),cf=cfgOf(p,f),g=geom(f,cf.cuts);
  const cn=$('#cutnote');if(cn)cn.textContent=`Descuentos: arriba ${fmt(cf.cuts.t)}, abajo ${fmt(cf.cuts.b)}, izq ${fmt(cf.cuts.l)}, dcha ${fmt(cf.cuts.r)} mm`+(f.cfg?' (propios de este frente)':'');
  if(!g){el.innerHTML=`<div class="empty">Faltan ${8-filled(f)} medida${8-filled(f)==1?'':'s'} para dibujar la pieza.</div>`;return;}
  const R=cf.dia/2,encs=(f.enchufes||[]).map((e,i)=>({i,e,g:encGeom(e,cf)})).filter(x=>x.g);
  const cops=(f.copetes||[]).map((cp,j)=>{const q=copGeom(cp,g),off=-(q.A+250)*j;return{...q,j,pts:q.pts.map(t=>[t[0],t[1]+off])};});
  const bb=bbox([...g.meas,...g.fin,[0,0],...encs.flatMap(x=>x.g.pts),...cops.flatMap(q=>q.pts.map(t=>[t[0],t[1]-120]))]),sz=Math.max(bb.w,bb.h),pad=sz*0.12,fs=sz/18;
  const out=encs.filter(x=>x.g.pts.some(q=>!inPoly(q,g.fin)));
  const pt=a=>a.map(q=>`${q[0]},${-q[1]}`).join(' ');
  const d=dims(g.fin),fin=g.fin,cen=[(fin[0][0]+fin[2][0])/2,(fin[0][1]+fin[2][1])/2];

    return `<text x="${mx+nx*fs*1.1}" y="${-(my+ny*fs*1.1)}" font-size="${fs}" text-anchor="middle" dominant-baseline="middle" font-weight="700" fill="#065f46">${fmt(v)}</text>`;};
  el.innerHTML=`<svg viewBox="${bb.minX-pad} ${-bb.maxY-pad} ${bb.w+2*pad} ${bb.h+2*pad}">
   <line x1="${bb.minX-pad/2}" y1="0" x2="${bb.maxX+pad/2}" y2="0" stroke="#dc2626" stroke-dasharray="${fs/2} ${fs/3}" vector-effect="non-scaling-stroke"/>
   <line x1="0" y1="${-bb.maxY-pad/2}" x2="0" y2="${-bb.minY+pad/2}" stroke="#dc2626" stroke-dasharray="${fs/2} ${fs/3}" vector-effect="non-scaling-stroke"/>
   <polygon points="${pt(g.meas)}" fill="none" stroke="#9ca3af" stroke-dasharray="${fs/2} ${fs/3}" vector-effect="non-scaling-stroke"/>
   <polygon points="${pt(g.fin)}" fill="#fed7aa" fill-opacity=".55" stroke="#111827" stroke-width="2" vector-effect="non-scaling-stroke"/>
   ${lab(fin[0],fin[1],d.top)}${lab(fin[3],fin[2],d.bottom)}${lab(fin[0],fin[3],d.left)}${lab(fin[1],fin[2],d.right)}
   ${encs.map(x=>(x.g.pts.length>1?(()=>{const b=bbox(x.g.pts);return `<rect x="${b.minX-R}" y="${-b.maxY-R}" width="${b.w+2*R}" height="${b.h+2*R}" rx="${R}" ry="${R}" fill="#fff" stroke="#2563eb" stroke-width="2" vector-effect="non-scaling-stroke"/>`;})():`<circle cx="${x.g.pts[0][0]}" cy="${-x.g.pts[0][1]}" r="${R}" fill="#fff" stroke="#2563eb" stroke-width="2" vector-effect="non-scaling-stroke"/>`)+`<text x="${x.g.c[0]}" y="${-(x.g.c[1]+R*(x.e.ori==='v'?(+x.e.n||1):1)+fs*0.4)}" font-size="${fs*0.8}" text-anchor="middle" fill="#2563eb" font-weight="700">E${x.i+1}</text>`).join('')}

// ---------- Foto anotada ----------
let hits=[],curImg=null;
function arrowsFor(f,W,H){
  const X=f.cx*W,Y=f.cy*H,ya=Y*0.4,yb=Y+(H-Y)*0.6,xl=X*0.15,xr=X+(W-X)*0.85;
  return{lt:[[X,ya],[W*0.02,ya]],lb:[[X,yb],[W*0.02,yb]],rt:[[X,ya],[W*0.98,ya]],rb:[[X,yb],[W*0.98,yb]],
    ul:[[xl,Y],[xl,H*0.02]],dl:[[xl,Y],[xl,H*0.98]],ur:[[xr,Y],[xr,H*0.02]],dr:[[xr,Y],[xr,H*0.98]]};
}
function drawAnnot(ctx,img,W,H,f,collect){
  const out=[];ctx.clearRect(0,0,W,H);ctx.drawImage(img,0,0,W,H);
  const s=Math.max(W,H)/900,X=f.cx*W,Y=f.cy*H;
  ctx.save();ctx.lineCap='round';
  ctx.strokeStyle='rgba(255,30,30,.95)';ctx.lineWidth=2.5*s;ctx.setLineDash([12*s,7*s]);
  ctx.beginPath();ctx.moveTo(0,Y);ctx.lineTo(W,Y);ctx.moveTo(X,0);ctx.lineTo(X,H);ctx.stroke();ctx.setLineDash([]);
  ctx.fillStyle='rgba(255,30,30,.95)';ctx.beginPath();ctx.arc(X,Y,6*s,0,7);ctx.fill();
  for(const st of (f.draw||[]))strokePath(ctx,st,W,H,s);
  const ar=arrowsFor(f,W,H);
  for(const k of KEYS){
    const[a,b]=ar[k];ctx.strokeStyle='#facc15';ctx.fillStyle='#facc15';ctx.lineWidth=3*s;
    ctx.beginPath();ctx.moveTo(a[0],a[1]);ctx.lineTo(b[0],b[1]);ctx.stroke();
    const ang=Math.atan2(b[1]-a[1],b[0]-a[0]),hl=14*s;
    ctx.beginPath();ctx.moveTo(b[0],b[1]);ctx.lineTo(b[0]-hl*Math.cos(ang-0.45),b[1]-hl*Math.sin(ang-0.45));ctx.lineTo(b[0]-hl*Math.cos(ang+0.45),b[1]-hl*Math.sin(ang+0.45));ctx.closePath();ctx.fill();
    const v=num(f.m[k]),t=v==null?'?':fmt(v);
    ctx.font=`700 ${Math.round(24*s)}px system-ui,sans-serif`;
    const tw=ctx.measureText(t).width,bw=Math.max(tw+18*s,40*s),bh=36*s,cx=(a[0]+b[0])/2,cy=(a[1]+b[1])/2;
    const r={k,x:cx-bw/2,y:cy-bh/2,w:bw,h:bh};
    ctx.fillStyle=v==null?'#ea580c':'rgba(17,24,39,.9)';rr(ctx,r.x,r.y,r.w,r.h,8*s);ctx.fill();
    ctx.strokeStyle=PAIRC[k];ctx.lineWidth=3.5*s;ctx.stroke();
    if(collect&&typeof Dict!=='undefined'&&((Dict&&DORDER[Dict.i]===k)||(!Dict&&typeof Laser!=='undefined'&&Laser.conectado()&&route.v==='frente'&&lzTarget()===k))){ctx.save();ctx.strokeStyle='#f59e0b';ctx.lineWidth=6*s;rr(ctx,r.x-7*s,r.y-7*s,r.w+14*s,r.h+14*s,12*s);ctx.stroke();ctx.restore();}
    ctx.fillStyle='#fff';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t,cx,cy+1*s);
    out.push(r);
  }
  (f.notes||[]).forEach((n,i)=>{
    ctx.font=`600 ${Math.round(22*s)}px system-ui,sans-serif`;
    const tw=ctx.measureText(n.t).width,bw=tw+20*s,bh=34*s,x=n.x*W,y=n.y*H;
    const r={note:i,x:x-bw/2,y:y-bh/2,w:bw,h:bh};
    ctx.fillStyle='rgba(254,240,138,.95)';rr(ctx,r.x,r.y,r.w,r.h,6*s);ctx.fill();
    ctx.fillStyle='#111827';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(n.t,x,y+1*s);out.push(r);
  });
  ctx.restore();if(collect)hits=out;
}
function strokePath(ctx,st,W,H,s){
  const p=st.p;if(!p||p.length<2)return;
  ctx.save();ctx.strokeStyle=st.c;ctx.fillStyle=st.c;ctx.lineWidth=st.w*s;ctx.lineCap='round';ctx.lineJoin='round';
  if(p.length===2){ctx.beginPath();ctx.arc(p[0]/1000*W,p[1]/1000*H,st.w*s/2,0,7);ctx.fill();ctx.restore();return;}
  ctx.beginPath();ctx.moveTo(p[0]/1000*W,p[1]/1000*H);for(let i=2;i<p.length;i+=2)ctx.lineTo(p[i]/1000*W,p[i+1]/1000*H);ctx.stroke();ctx.restore();
}
function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}

async function setupCanvas(){
  const f=F(),cv=$('#cv');if(!cv)return;
  curImg=await getImg(f.photo);
  if(!curImg){cv.parentElement.innerHTML='<div class="empty" style="color:#fff">No se pudo cargar la foto.</div>';return;}
  drawCanvas();
  cv.style.touchAction=(mode==='laser'||mode==='draw')?'none':'manipulation';
  let drag=false,stroke=null,penSeen=false,lastPt=null;
  const pos=e=>{const r=cv.getBoundingClientRect();return[(e.clientX-r.left)*cv.width/r.width,(e.clientY-r.top)*cv.height/r.height];};
  const setCross=([x,y])=>{const f=F();f.cx=Math.min(.98,Math.max(.02,x/cv.width));f.cy=Math.min(.98,Math.max(.02,y/cv.height));drawCanvas();};
  cv.onpointerdown=e=>{
    const pt=pos(e);
    if(mode==='laser'){drag=true;try{cv.setPointerCapture(e.pointerId);}catch(_){}setCross(pt);return;}
    if(mode==='draw'){
      if(e.pointerType==='pen')penSeen=true;
      if(penSeen&&e.pointerType==='touch')return;
      e.preventDefault();try{cv.setPointerCapture(e.pointerId);}catch(_){}
      const f=F();stroke={c:drawColor,w:drawW,p:[Math.round(pt[0]/cv.width*1000),Math.round(pt[1]/cv.height*1000)]};
      (f.draw=f.draw||[]).push(stroke);lastPt=pt;
      const ctx=cv.getContext('2d');strokePath(ctx,{...stroke,p:stroke.p.concat(stroke.p)},cv.width,cv.height,Math.max(cv.width,cv.height)/900);
      return;
    }
    const h=hits.slice().reverse().find(r=>pt[0]>=r.x&&pt[0]<=r.x+r.w&&pt[1]>=r.y&&pt[1]<=r.y+r.h);
    if(mode==='med'&&Dict&&h&&h.k){const j=DORDER.indexOf(h.k);if(j>=0){Dict.i=j;Dict.heard='';dictBanner();}return;}
    if(mode==='med'&&Laser.conectado()&&h&&h.k&&DORDER.includes(h.k)){LZ.k=h.k;lzMark();toast('Siguiente medida: '+KLAB[h.k]);return;}
    if(mode==='med'){if(h&&h.k)editMeasure(h.k);else if(h&&h.note!=null)editNote(h.note);}
    else if(mode==='nota'){if(h&&h.note!=null)editNote(h.note);else addNote(pt[0]/cv.width,pt[1]/cv.height);}
  };
  cv.onpointermove=e=>{
    if(drag&&mode==='laser'){setCross(pos(e));return;}
    if(stroke&&mode==='draw'){
      const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
      const ctx=cv.getContext('2d'),sc=Math.max(cv.width,cv.height)/900,min=2.5*(window.devicePixelRatio||1);
      ctx.save();ctx.strokeStyle=stroke.c;ctx.lineWidth=stroke.w*sc;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(lastPt[0],lastPt[1]);
      for(const ev of evs){const pt=pos(ev);if(Math.hypot(pt[0]-lastPt[0],pt[1]-lastPt[1])<min)continue;
        ctx.lineTo(pt[0],pt[1]);stroke.p.push(Math.round(pt[0]/cv.width*1000),Math.round(pt[1]/cv.height*1000));lastPt=pt;}
      ctx.stroke();ctx.restore();
    }
  };
  cv.onpointerup=cv.onpointercancel=()=>{
    if(drag){drag=false;Store.save(P());}
    if(stroke){stroke=null;lastPt=null;drawCanvas();Store.save(P());}
  };
}
function drawCanvas(){
  const cv=$('#cv'),f=F();if(!cv||!curImg||!f)return;
  const w=cv.parentElement.clientWidth||600,dpr=Math.min(window.devicePixelRatio||1,2.5);
  const W=Math.round(w*dpr),H=Math.round(W*curImg.naturalHeight/curImg.naturalWidth);
  if(cv.width!==W||cv.height!==H){cv.width=W;cv.height=H;}
  drawAnnot(cv.getContext('2d'),curImg,W,H,f,true);
}
window.addEventListener('resize',()=>drawCanvas());

let dictUnit=LS.get('fc_du','obra'),Dict=null;
const UNITTXT={obra:'metros y centímetros (ej.: «uno cincuenta y siete con cinco»)',cm:'cm',mm:'mm'};
function parseMeasure(t){
  const c=parseSpoken(t);if(c&&(c.cmd||c.noise))return c;
  if(dictUnit==='obra')return parseObra(t);
  if(c&&c.num!=null)return{mm:c.num*(dictUnit==='cm'?10:1)};
  return null;
}
function dictStart(){
  if(!SRec){toast(inClaude?'Para dictar usa la versión de GitHub (Safari en iPad o Chrome en Android).':'Este navegador no permite dictar. Usa Safari en iPad o Chrome en Android.');return;}
  if(Dict)return;
  const f=F();let i=DORDER.findIndex(k=>num(f.m[k])==null);if(i<0)i=0;
  Dict={i,rec:null,heard:'',on:true};dictListen();dictBanner();
}
// Junta lo que se dice y solo lo procesa tras una pausa (para quien habla pausado)
let dictPause=+LS.get('fc_pause',1.5);
function collector(st,commit,show){
  const N=x=>String(x||'').toLowerCase().replace(/[.,;:¿?¡!]/g,' ').replace(/\s+/g,' ').trim();
  st.buf='';st.interim='';st.done=new Set();st.consumed='';st.lastRaw='';st.wait=0;clearTimeout(st.timer);
  const strip=raw=>{let t=N(raw);if(st.consumed&&t.startsWith(st.consumed))t=t.slice(st.consumed.length).trim();return t;};
  const fire=()=>{
    if(st.interim&&st.wait<4){st.wait++;st.timer=setTimeout(fire,700);return;} // aún está reconociendo: esperar
    const t=(st.buf+(st.wait>=4&&st.interim?' '+st.interim:'')).trim();
    st.consumed=st.lastRaw;st.buf='';st.interim='';st.wait=0;
    if(t)commit(t);
  };
  return e=>{
    for(let j=e.resultIndex;j<e.results.length;j++){const res=e.results[j];
      if(res.isFinal){
        if(st.done.has(j))continue;st.done.add(j);
        const raw=N(res[0].transcript);const fin=strip(res[0].transcript);st.lastRaw=raw;st.interim='';
        if(!fin)continue;
        if(st.buf&&fin.startsWith(st.buf))st.buf=fin;          // Safari: texto acumulado
        else if(st.buf&&st.buf.endsWith(fin))continue;          // repetido
        else st.buf=(st.buf+' '+fin).trim();
      }else{let it=strip(res[0].transcript);if(st.buf&&it.startsWith(st.buf))it=it.slice(st.buf.length).trim();st.interim=it;}
    }
    const now=(st.buf+' '+st.interim).trim();if(!now)return;
    show(now);clearTimeout(st.timer);st.wait=0;
    st.timer=setTimeout(fire,dictPause*1000);
  };
}
function dictListen(){
  if(!Dict)return;
  try{
    const r=new SRec();r.lang='es-ES';r.continuous=true;r.interimResults=true;r.maxAlternatives=3;
    Dict.col=Dict.col||{};
    r.onstart=()=>{if(Dict&&Dict.col){Dict.col.done=new Set();Dict.col.consumed='';}};
    r.onresult=collector(Dict.col,t=>{if(!Dict)return;const q=parseMeasure(t);if(q&&q.noise){Dict.heard='';dictBanner();return;}if(q)dictApply(q,t);else{Dict.heard='No he entendido: «'+t+'»';dictBanner();}},
      t=>{if(!Dict)return;Dict.heard='🗣 '+t+' …';dictBanner();});
    r.onerror=e=>{if(e.error==='not-allowed'||e.error==='service-not-allowed'){toast('Sin permiso para el micrófono');dictStop();}};
    r.onend=()=>{if(Dict&&Dict.rec===r){setTimeout(()=>{if(Dict&&Dict.rec===r){try{r.start();}catch(err){Dict.heard='Pulsa 🎤 Seguir para continuar';Dict.paused=true;dictBanner();}}},150);}};
    Dict.rec=r;Dict.paused=false;r.start();
  }catch(e){toast('No se pudo activar el micrófono');dictStop();}
}
function dictApply(q,raw){
  if(!Dict)return;
  if(q.cmd==='stop')return dictStop();
  if(q.cmd==='back'){Dict.i=Math.max(0,Dict.i-1);Dict.heard='';return dictBanner();}
  if(q.cmd==='next'){Dict.heard='';return dictNext();}
  const k=DORDER[Dict.i],v=Math.round(q.mm*10)/10,sv=String(v);
  setMeasureInput(k,sv);if(MIRROR[k])setMeasureInput(MIRROR[k],sv);
  Store.save(P());drawCanvas();renderPrev();
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  Dict.heard='✓ '+KLAB[k]+': '+fmt(v)+' mm';dictNext();
}
function dictNext(){
  if(!Dict)return;Dict.i++;
  if(Dict.i>=DORDER.length){toast('Medidas dictadas');return dictStop();}
  dictBanner();
}
function dictStop(){
  if(!Dict)return;if(Dict.col)clearTimeout(Dict.col.timer);const r=Dict.rec;Dict=null;try{r&&r.stop();}catch(e){}
  document.querySelectorAll('input.dicting').forEach(x=>x.classList.remove('dicting'));
  const b=$('#dictbar');b.hidden=true;b.innerHTML='';drawCanvas();document.body.style.paddingBottom='';
  if(typeof lzMark==='function')lzMark();

function dictBanner(){
  const b=$('#dictbar');drawCanvas();if(!Dict){b.hidden=true;document.body.style.paddingBottom='';return;}
  document.body.style.paddingBottom='170px';
  const k=DORDER[Dict.i];
  document.querySelectorAll('input[data-k]').forEach(x=>x.classList.toggle('dicting',x.dataset.k===k));
  b.hidden=false;
  b.innerHTML=`<div class="lab">${Dict.paused?'⏸':'<span class="mic"></span>'}<span style="display:inline-block;width:12px;height:12px;border-radius:50%;background:${PAIRC[k]}"></span>${esc(KLAB[k])}</div>
    <div class="note" style="color:#d1d5db">Di la medida en <b>${esc(UNITTXT[dictUnit])}</b> · ${Dict.i+1} de ${DORDER.length} · «igual» salta, «atrás» vuelve, «parar» termina</div>

      t=>{if(!ED||!ED.els[0].isConnected)return encDictStop();encDictShow('🗣 '+t+' …');});

function encDictApply(raw){

  const st=ED.steps[ED.s];
  const q=parseMeasure(t);
  if(q&&q.cmd==='stop'){encDictStop();return true;}
  if(q&&q.cmd==='back'){ED.s=Math.max(0,ED.s-1);encDictShow('');return true;}
  if(!st)return false;
  if(q&&q.cmd==='next'){encDictNext();return true;}
  const el=ED.els[st.i];
  if(st.num){if(q&&q.noise){encDictShow('');return true;}if(!q||q.mm==null)return false;el.value=String(Math.round(q.mm*10)/10);}
  else{const v=st.w(t);if(v==null)return false;el.value=v;}

  encDictNext();return true;
}

// ---------- Láser Bluetooth (Bosch GLM / Leica DISTO) ----------
/*
 * laser.js — Conexión de medidores láser por Bluetooth (Web Bluetooth)
 * Soporta: Bosch GLM 50 C (y otros GLM "C") y Leica DISTO con Bluetooth Smart.
 * Funciona en Chrome Android / Chrome-Edge escritorio y en Bluefy (iPad/iPhone).
 *
 * Uso:
 *   Laser.onMedida = (mm) => { ... };      // medida en milímetros
 *   Laser.onEstado = (texto) => { ... };   // mensajes de estado
 *   Laser.onRaw    = (hex) => { ... };     // datos crudos (diagnóstico)
 *   Laser.conectar();                      // llamar desde un clic de botón
 *   Laser.desconectar();
 */
(function (global) {
  'use strict';

  // Bosch: los GLM nuevos usan 02a6c0d0…; los GLM 50 C antiguos usan 00005301…
  const BOSCH_SERVICES = [
    '02a6c0d0-0451-4000-b000-fb3210111989',
    '00005301-0000-0041-5253-534f46540000'
  ];
  const BOSCH_MEDIR = new Uint8Array([0xC0, 0x56, 0x01, 0x00, 0x1E]);
  // Activa el envío automático de cada medida al pulsar el botón del láser
  const BOSCH_AUTOSYNC = new Uint8Array([0xC0, 0x55, 0x02, 0x01, 0x00, 0x1A]);

  const LEICA_SERVICE = '3ab10100-f831-4395-b29d-570977d5bf94';
  const LEICA_DIST    = '3ab10101-f831-4395-b29d-570977d5bf94';

  const Laser = {
    onMedida: null,
    onEstado: null,
    onRaw: null,
    onDiag: null,
    device: null,
    marca: null,
    _ultima: { mm: null, t: 0 },

    soportado() {
      return !!(navigator.bluetooth && navigator.bluetooth.requestDevice);
    },

    _estado(t) { if (this.onEstado) this.onEstado(t); },
    _diag(t) { if (this.onDiag) this.onDiag(t); else this._estado(t); },
    conectado() { return !!(this.device && this.device.gatt && this.device.gatt.connected && this.marca); },

    _hex(dv) {
      const a = [];
      for (let i = 0; i < dv.byteLength; i++) a.push(dv.getUint8(i).toString(16).padStart(2, '0'));
      return a.join(' ');
    },

    _emitir(metros) {
      if (!isFinite(metros) || metros <= 0.01 || metros > 250) return;
      const mm = Math.round(metros * 1000);
      // Evita duplicados (algunos láser repiten el paquete)
      const ahora = Date.now();
      if (mm === this._ultima.mm && ahora - this._ultima.t < 700) return;
      this._ultima = { mm, t: ahora };
      if (this.onMedida) this.onMedida(mm);
    },

    async conectar() {
      if (!this.soportado()) {
        this._estado('Este navegador no tiene Bluetooth web. En Android usa Chrome; en iPad usa Bluefy.');
        return false;
      }
      try {
        this._estado('Buscando láser…');
        const device = await navigator.bluetooth.requestDevice({
          // Muestra todos los dispositivos BLE cercanos: algunos láser no anuncian su servicio ni un nombre fijo
          acceptAllDevices: true,
          optionalServices: [...BOSCH_SERVICES, LEICA_SERVICE]
        });
        this.device = device;
        device.addEventListener('gattserverdisconnected', () => {
          this.marca = null; this._chBosch = null;
          this._estado('Láser desconectado');
        });
        this._estado('Conectando a ' + (device.name || 'láser') + '…');
        const server = await device.gatt.connect();

        this._diag('Conectado a "' + (device.name || 'sin nombre') + '". Buscando servicios…');
        try {
          const lista = await server.getPrimaryServices();
          this._diag('Servicios visibles: ' + (lista.length ? lista.map(s => s.uuid).join(', ') : 'ninguno'));
        } catch (e) { this._diag('No se pudieron listar servicios: ' + e.message); }

        // ¿Bosch?
        for (const uuid of BOSCH_SERVICES) {
          try {
            const srv = await server.getPrimaryService(uuid);
            this._diag('Servicio Bosch encontrado: ' + uuid);
            const chars = await srv.getCharacteristics();
            const ch = chars.find(c => c.properties.indicate || c.properties.notify);
            if (!ch) { this._diag('Bosch: sin característica de avisos'); continue; }
            const p = ch.properties;
            this._diag('Característica ' + ch.uuid + ' indicate=' + p.indicate + ' notify=' + p.notify + ' write=' + p.write);
            ch.addEventListener('characteristicvaluechanged', (e) => this._bosch(e.target.value));
            await ch.startNotifications();
            this._chBosch = ch;
            try { await this._escribir(BOSCH_AUTOSYNC); }
            catch (e) { this._diag('Aviso al activar envío automático: ' + e.message); }
            this.marca = 'Bosch';
            this._estado('Conectado: ' + (device.name || 'Bosch GLM') + '. Pulsa el botón de medir del láser.');
            return true;
          } catch (e) { this._diag('Bosch ' + uuid.slice(0, 8) + ': ' + e.message); }
        }

        // ¿Leica?
        try {
          const srv = await server.getPrimaryService(LEICA_SERVICE);
          const ch = await srv.getCharacteristic(LEICA_DIST);
          ch.addEventListener('characteristicvaluechanged', (e) => {
            const dv = e.target.value;
            if (this.onRaw) this.onRaw(this._hex(dv));
            if (dv.byteLength >= 4) this._emitir(dv.getFloat32(0, true));
          });
          await ch.startNotifications();
          this.marca = 'Leica';
          this._estado('Conectado: ' + (device.name || 'Leica DISTO') + '. Pulsa el botón de medir del láser.');
          return true;
        } catch (e) { this._diag('Leica: ' + e.message); }

        this._estado('Conectado, pero no reconozco el modelo del láser.');
        return false;
      } catch (err) {
        if (err && err.name === 'NotFoundError') this._estado('No se eligió ningún láser.');
        else this._estado('Error: ' + (err && err.message ? err.message : err));
        return false;
      }
    },

    _bosch(dv) {
      if (this.onRaw) this.onRaw(this._hex(dv));
      const n = dv.byteLength;
      // Formato habitual: C0 55 10 06 ... con la distancia (float32, metros) en el byte 7
      if (n >= 11 && dv.getUint8(0) === 0xC0 && dv.getUint8(1) === 0x55 && dv.getUint8(2) === 0x10) {
        const m = dv.getFloat32(7, true);
        if (m > 0.01 && m < 250) { this._emitir(m); return; }
      }
      // Respuesta a otras órdenes (C0 55 02 …, 00 00 …): no es una medida
    },

    async _escribir(bytes) {
      const ch = this._chBosch;
      if (!ch) return;
      if (ch.properties.write) await ch.writeValueWithResponse(bytes);
      else await ch.writeValueWithoutResponse(bytes);
    },

    // Dispara una medida desde la app (solo Bosch)
    async medir() {
      if (!this._chBosch) { this._estado('Primero conecta un láser Bosch'); return; }
      try { await this._escribir(BOSCH_MEDIR); this._estado('Orden de medir enviada'); }
      catch (e) { this._estado('Error al medir: ' + e.message); }
    },

    desconectar() {
      if (this.device && this.device.gatt.connected) this.device.gatt.disconnect();
    }
  };

  global.Laser = Laser;
})(window);

const LZ={k:null};               // casilla que recibirá la próxima medida del láser

function lzMark(){
  if(Dict||route.v!=='frente')return;
  const k=Laser.conectado()?lzTarget():null;
  document.querySelectorAll('input[data-k]').forEach(x=>x.classList.toggle('dicting',x.dataset.k===k));
  drawCanvas();
}
function lzUI(){
  const b=$('#lzBtn'),m=$('#lzMed'),on=Laser.conectado();
  if(b){b.textContent=on?'📏 Láser conectado':'📏 Conectar láser';b.classList.toggle('on',on);}
  if(m)m.hidden=!(on&&Laser.marca==='Bosch');
  lzMark();
}
Laser.onEstado=t=>{const e=$('#lzSt');if(e)e.textContent=t;if(/desconectado|Error|no reconozco/i.test(t))toast(t);lzUI();};
Laser.onDiag=t=>console.log('[láser]',t);
Laser.onMedida=mm=>{
  const sv=String(mm);
  try{navigator.vibrate&&navigator.vibrate(60);}catch(e){}
  // Si hay una casilla de texto activa fuera de las 8 medidas (enchufe, ventana de medida…), la medida va ahí
  const ae=document.activeElement;
  if(ae&&ae.tagName==='INPUT'&&!ae.dataset.k&&(ae.inputMode==='decimal'||ae.closest('#mbox'))&&ae.type!=='checkbox'){
    ae.value=sv;ae.dispatchEvent(new Event('input',{bubbles:true}));toast('Láser: '+sv+' mm');return;
  }
  if(route.v!=='frente'||!F()){toast('Láser: '+sv+' mm (abre un frente para guardarla)');return;}
  if(Dict){dictApply({mm},sv);return;}
  const k=lzTarget(),p=P(),f=F();
  setMeasureInput(k,sv);if(MIRROR[k])setMeasureInput(MIRROR[k],sv);
  Store.save(p);renderPrev();
  const i=DORDER.indexOf(k);
  toast('✓ '+KLAB[k]+': '+sv+' mm');
  if(i>=0&&i<DORDER.length-1)LZ.k=DORDER[i+1];else{LZ.k=DORDER[0];toast('Medidas del frente completas');}
  lzMark();
};
const A={
  locSave(){
    const p=P();if(!navigator.geolocation){toast('Este dispositivo no da la posición');return;}
    const g=$('#locGps');if(g)g.textContent='Buscando posición…';
    navigator.geolocation.getCurrentPosition(pos=>{
      const c=pos.coords;p.loc={...(p.loc||{}),lat:c.latitude,lng:c.longitude,acc:c.accuracy};Store.save(p);
      toast('Posición de la obra guardada');if(route.v==='promo')render();
    },err=>{toast(err.code===1?'Sin permiso para la ubicación':'No se pudo obtener la posición');if(route.v==='promo')render();},{enableHighAccuracy:true,timeout:20000,maximumAge:0});
  },
  locNav(){
    const p=P(),l=p.loc||{},lt=$('#locTxt'),txt=(lt&&lt.value.trim())||l.txt||'';
    const dest=l.lat!=null?l.lat+','+l.lng:txt;
    if(!dest){toast('Guarda la posición o escribe la dirección de la obra');return;}
    window.open('https://www.google.com/maps/dir/?api=1&destination='+encodeURIComponent(dest),'_blank');
  },
  addCop(){copForm(null);},
  editCop(d){copForm(+d.i);},
  lzCon(){if(!Laser.soportado()){toast(/iPad|iPhone|Macintosh/.test(navigator.userAgent)?'En iPad abre la app en el navegador Bluefy para usar el láser.':'Este navegador no tiene Bluetooth. Usa Chrome.');return;}if(Laser.conectado()){Laser.desconectar();return;}Laser.conectar();},
  lzMed(){Laser.medir();},
  async newPromo(){const t=await askText('Nueva promoción','Título de la promoción','','p. ej. Residencial Los Olmos');if(!t)return;
    const p={id:'p_'+uid(),title:t,cuts:{t:2,b:12,l:2,r:2},dia:68,sep:70,pisos:[],updated:Date.now()};S.promos.push(p);Store.save(p);go({v:'promo',p:p.id});},
  openPromo(d){go({v:'promo',p:d.id});},
  async renPromo(){const p=P(),t=await askText('Renombrar promoción','Título',p.title);if(t){p.title=t;Store.save(p);render();}},
  async delPromo(){const p=P();if(!await confirmDel('la promoción "'+p.title+'"'))return;S.promos=S.promos.filter(x=>x!==p);await Store.remove(p.id);go({v:'home'});},
  async newPiso(){const p=P(),r=await pisoForm(null);if(!r)return;
    const pi={id:uid(),title:r.title,fecha:r.fecha,frentes:[]};p.pisos.push(pi);Store.save(p);go({v:'piso',p:p.id,pi:pi.id});},
  openPiso(d){go({v:'piso',p:route.p,pi:d.id});},
  async renPiso(){const pi=PI(),r=await pisoForm(pi);if(r){pi.title=r.title;pi.fecha=r.fecha;Store.save(P());render();}},
  async delPiso(){const p=P(),pi=PI();if(!await confirmDel('el piso "'+pi.title+'"'))return;p.pisos=p.pisos.filter(x=>x!==pi);Store.save(p);go({v:'promo',p:p.id});},
  addCam(){pickPhoto('#fCam',null);},addGal(){pickPhoto('#fGal',null);},
  addNoPhoto(){newFrente(null);},
  openFrente(d){go({v:'frente',p:route.p,pi:route.pi,f:d.id});},
  photoCam(){pickPhoto('#fCam',F());},photoGal(){pickPhoto('#fGal',F());},
  async renFrente(){const f=F(),pi=PI(),t=await askText('Renombrar frente','Nombre',f.name||('Frente '+(pi.frentes.indexOf(f)+1)));if(t){f.name=t;Store.save(P());render();}},
  async delFrente(){const p=P(),pi=PI(),f=F();if(!await confirmDel('este frente'))return;pi.frentes=pi.frentes.filter(x=>x!==f);Store.save(p);go({v:'piso',p:p.id,pi:pi.id});},
  mode(d){mode=d.m;render();},
  dictStart(){dictStart();},
  orderEdit(){orderEditor();},
  syncNow(){Store.sync(true);},
  async logout(){
    const n=Store.pending();
    const r=await modal({title:'¿Cerrar sesión en este dispositivo?',text:(n?'Hay '+n+' cambio(s) sin subir y se perderán. ':'')+'Se borrarán los datos guardados en este dispositivo (en Google siguen intactos). Para volver a entrar hará falta la clave.',buttons:[{label:'Cancelar',v:null},{label:'Cerrar sesión',v:'ok',dang:true}]});
    if(r.v)await Store.wipe();},
  addEnc(){encForm(null);},
  editEnc(d){encForm(+d.i);},
  dcol(d){drawColor=d.c;try{localStorage.setItem('fc_dc',drawColor);}catch(e){}render();},
  dw(d){drawW=+d.w;try{localStorage.setItem('fc_dw',String(drawW));}catch(e){}render();},
  dundo(){const f=F();if(f.draw&&f.draw.length){f.draw.pop();Store.save(P());drawCanvas();}},
  async dclear(){const f=F();if(!f.draw||!f.draw.length)return;if(!await confirmDel('todo el dibujo de esta foto'))return;f.draw=[];Store.save(P());drawCanvas();},
  async dxfFrente(){const p=P(),pi=PI(),f=F();if(!geom(f,p.cuts)){toast('Faltan medidas');return;}
    const one={...pi,frentes:[f]},nm=safe(pi.title)+' - '+safe(f.name||'Frente '+(pi.frentes.indexOf(f)+1));
    const files=[{name:nm+'.dxf',data:buildDXF(p,[one])}];
    if(f.photo){const j=await annotatedJpg(f);if(j)files.push({name:nm+'.jpg',data:j});}
    await offer(safe(p.title)+' - '+nm,inClaude?files:files.slice(0,1));afterExport(safe(p.title)+' - '+nm,files.slice(0,1));},
  async copyDxf(){const p=P(),pi=PI(),f=F();if(!geom(f,p.cuts)){toast('Faltan medidas');return;}
    try{await navigator.clipboard.writeText(buildDXF(p,[{...pi,frentes:[f]}]));toast('DXF copiado. Pégalo en un archivo .dxf');}catch(e){toast('No se pudo copiar');}},
  async photoJpg(){const pi=PI(),f=F();const j=await annotatedJpg(f);if(!j)return;offer('foto',[{name:safe(pi.title)+' - '+safe(f.name||'Frente')+'.jpg',data:j}]);},
  async dxfPiso(){const p=P(),pi=PI();if(!pi.frentes.some(f=>geom(f,p.cuts))){toast('Ningún frente tiene las 8 medidas');return;}
    toast('Preparando…');const files=[{name:safe(pi.title)+'.dxf',data:buildDXF(p,[pi])},...(await photoFiles(pi,'fotos/'))];
    await offer(safe(p.title)+' - '+safe(pi.title),files);afterExport(safe(p.title)+' - '+safe(pi.title),files.filter(f=>/\.dxf$/i.test(f.name)));},
  async dxfAllPisos(){const p=P();
    const ok=p.pisos.filter(pi=>pi.frentes.some(f=>geom(f,p.cuts)));
    if(!ok.length){toast('Ningún frente tiene las 8 medidas');return;}
    const used={},files=ok.map(pi=>{let n=safe(pi.title);used[n]=(used[n]||0)+1;if(used[n]>1)n+=' ('+used[n]+')';return{name:n+'.dxf',data:buildDXF(p,[pi])};});
    const sin=p.pisos.length-ok.length;
    await offer(safe(p.title)+' - DXF pisos',files);afterExport(safe(p.title)+' - DXF pisos',files);
    if(sin)setTimeout(()=>toast(sin+' piso'+(sin>1?'s':'')+' sin medidas completas no incluido'+(sin>1?'s':'')),2800);},
  async dxfPromo(){const p=P();if(!p.pisos.some(pi=>pi.frentes.some(f=>geom(f,p.cuts)))){toast('Ningún frente tiene las 8 medidas');return;}
    toast('Preparando…');const files=[];
    for(const pi of p.pisos){if(pi.frentes.some(f=>geom(f,p.cuts)))files.push({name:safe(pi.title)+'.dxf',data:buildDXF(p,[pi])});files.push(...await photoFiles(pi,'fotos/'));}
    files.unshift({name:'_TODOS LOS PISOS.dxf',data:buildDXF(p,p.pisos)});
    await offer(safe(p.title),files);afterExport(safe(p.title)+' - DXF',files.filter(f=>/\.dxf$/i.test(f.name)));},
  async exportAll(){
    toast('Preparando copia…');const photos={};
    if(incFotos)for(const p of S.promos)for(const pi of p.pisos)for(const f of pi.frentes){if(!f.photo)continue;
      try{const u=await Store.photoURL(f.photo);if(!u)continue;const b=await (await fetch(u)).blob();
        photos[JSON.stringify(f.photo)]=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(b);});}catch(e){}}
    const d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    const cf=[{name:'frentes-copia-'+ds+(incFotos?'':'-sin-fotos')+'.json',data:JSON.stringify({app:'frentes-cocina',v:1,promos:S.promos,photos})}];
    await offer('copia',cf);afterExport('Copia frentes '+ds,cf);},
  importAll(){$('#fImp').value='';$('#fImp').click();}
};
$('#app').addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const fn=A[b.dataset.act];if(fn)fn(b.dataset);});

let photoTarget=null;
function pickPhoto(sel,frente){photoTarget=frente?{f:frente.id}:{nuevo:true};const i=$(sel);i.value='';i.click();}
async function onPhoto(e){
  const file=e.target.files&&e.target.files[0];if(!file||!photoTarget)return;
  toast('Guardando foto…');
  try{
    const blob=await compress(file);const ref=await Store.savePhoto(blob);
    if(photoTarget.nuevo)newFrente(ref);
    else{const f=PI()&&PI().frentes.find(x=>x.id===photoTarget.f);if(f){f.photo=ref;Store.save(P());render();}}
    toast('Foto guardada');
  }catch(err){console.error(err);toast('No se pudo leer la foto');}
  photoTarget=null;
}
$('#fCam').onchange=onPhoto;$('#fGal').onchange=onPhoto;
function newFrente(ref){
  const p=P(),pi=PI();
  const f={id:uid(),name:'Frente '+(pi.frentes.length+1),photo:ref,cx:.5,cy:.55,m:{},notes:[],enchufes:[]};
  pi.frentes.push(f);Store.save(p);go({v:'frente',p:p.id,pi:pi.id,f:f.id});
}
async function onImport(e){
  const file=e.target.files&&e.target.files[0];if(!file)return;
  try{
    const d=JSON.parse(await file.text());if(!d||!Array.isArray(d.promos))throw new Error('formato');
    const r=await modal({title:'Importar copia',text:`Contiene ${d.promos.length} promoción(es) y ${Object.keys(d.photos||{}).length} foto(s). Las promociones que ya existan se sustituirán.`+(incFotos?'':' Las fotos no se importarán; se conservan las que ya haya en este dispositivo.'),buttons:[{label:'Cancelar',v:null},{label:'Importar',v:'ok',pri:true}]});
    if(!r.v)return;toast('Importando…');
    const map={};
    if(incFotos)for(const [k,du] of Object.entries(d.photos||{})){try{const b=await (await fetch(du)).blob();map[k]=await Store.savePhoto(b);}catch(_){}}
    const oldPh={};for(const op of S.promos)for(const pi of op.pisos)for(const f of pi.frentes)if(f.photo)oldPh[f.id]=f.photo;
    for(const p of d.promos){
      for(const pi of p.pisos||[])for(const f of pi.frentes||[]){const k=f.photo?JSON.stringify(f.photo):null;f.photo=(k&&map[k])||oldPh[f.id]||null;f.m=f.m||{};f.notes=f.notes||[];f.draw=f.draw||[];f.enchufes=f.enchufes||[];}
      p.cuts=p.cuts||{t:2,b:12,l:2,r:2};
      S.promos=S.promos.filter(x=>x.id!==p.id);S.promos.push(p);Store.save(p);
    }
    render();toast('Copia importada');
  }catch(err){console.error(err);toast('Archivo no válido');}
}
$('#fImp').onchange=onImport;
$('#app').addEventListener('change',e=>{
  const i=e.target.closest('input[data-file]');if(!i)return;const k=i.dataset.file;
  if(k==='imp')return onImport(e);
  photoTarget=k.endsWith('-new')?{nuevo:true}:{f:route.f};onPhoto(e);
});

setSync();
Store.init();
